" font-weight="500" text-anchor="start" data-edit="true">当時値をfactに保持する選択肢もある</text><text x="25" y="313" font-size="20" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">判断：過去を「当時」で見る？「最新」で見る？</text></g><g id="fact-notes" class="panel" data-x="770" data-y="666" transform="translate(770 666)"><rect width="640" height="355" rx="20" fill="#fff5df" stroke="#c8ae73" stroke-width="2"/><text x="25" y="43" font-size="28" fill="#304b3e" font-weight="800" text-anchor="start" data-edit="true">fact：出来事・状態を測る</text><text x="25" y="78" font-size="22" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">先に型を選ぶと、粒度・キー・更新が揃う</text><rect x="25" y="101" width="282" height="77" rx="9" fill="#fffaf0" stroke="#dfc994"/><text x="39" y="132" font-size="20" fill="#304b3e" font-weight="700" text-anchor="start" data-edit="true">トランザクション</text><text x="39" y="161" font-size="17" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">1回の出来事</text><rect x="332" y="101" width="282" height="77" rx="9" fill="#fffaf0" stroke="#dfc994"/><text x="346" y="132" font-size="20" fill="#304b3e" font-weight="700" text-anchor="start" data-edit="true">定期スナップショット</text><text x="346" y="161" font-size="17" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">ある時点の状態</text><rect x="25" y="190" width="282" height="77" rx="9" fill="#fffaf0" stroke="#dfc994"/><text x="39" y="221" font-size="20" fill="#304b3e" font-weight="700" text-anchor="start" data-edit="true">累積スナップショット</text><text x="39" y="250" font-size="17" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">プロセス1件・段階ごとに更新</text><rect x="332" y="190" width="282" height="77" rx="9" fill="#fffaf0" stroke="#dfc994"/><text x="346" y="221" font-size="20" fill="#304b3e" font-weight="700" text-anchor="start" data-edit="true">factレス</text><text x="346" y="250" font-size="17" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">出来事の有無だけ</text><text x="25" y="313" font-size="22" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">確認：加算性・NULLと0・単位・確定状態</text></g><g id="impl" class="node panel" data-x="1450" data-y="687" data-w="400" data-h="334" transform="translate(1450 687)"><rect width="400" height="334" rx="20" fill="#edf6eb" stroke="#8fae85" stroke-width="2"/><text x="22" y="40" font-size="28" fill="#304b3e" font-weight="800" text-anchor="start" data-edit="true">BigQuery 実装検討所</text><text x="22" y="74" font-size="21" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">論理モデルが固まったら検討</text><text x="22" y="114" font-size="19" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">物理設計：型・パーティション・キー</text><text x="22" y="149" font-size="19" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">ロード：差分・削除・遡及修正</text><text x="22" y="184" font-size="19" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">品質：一意性・参照整合性・NULL</text><path d="M22 207 h356" stroke="#bbceb2"/><text x="22" y="237" font-size="18" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">入力：源泉のビュー・マスタ</text><text x="22" y="266" font-size="18" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">設計：上の4工程／実装：BigQuery</text><text x="22" y="295" font-size="18" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">正本の保管先・配布先：検討中</text></g><g id="rules" class="panel" data-x="100" data-y="1039" transform="translate(100 1039)"><rect width="1750" height="273" rx="18" fill="#fff7df" stroke="#c1ad78" stroke-width="2"/><text x="24" y="39" font-size="27" fill="#304b3e" font-weight="800" text-anchor="start" data-edit="true">設計の決まり事 — この6つを守る</text><rect x="24" y="56" width="554" height="88" rx="8" fill="#fffaf0" stroke="#dccc9f"/><text x="40" y="83" font-size="22" fill="#304b3e" font-weight="800" text-anchor="start" data-edit="true">設計の順番</text><text x="40" y="109" font-size="20" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">先に「1行の意味」を宣言</text><text x="40" y="133" font-size="18" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">粒度が決まってから列を選ぶ</text><rect x="596" y="56" width="554" height="88" rx="8" fill="#fffaf0" stroke="#dccc9f"/><text x="612" y="83" font-size="22" fill="#304b3e" font-weight="800" text-anchor="start" data-edit="true">粒度を混ぜない</text><text x="612" y="109" font-size="20" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">最も細かい粒度で持つ</text><text x="612" y="133" font-size="18" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">明細・合計・実績・修正を混在させない</text><rect x="1168" y="56" width="554" height="88" rx="8" fill="#fffaf0" stroke="#dccc9f"/><text x="1184" y="83" font-size="22" fill="#304b3e" font-weight="800" text-anchor="start" data-edit="true">二重計上しない</text><text x="1184" y="109" font-size="20" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">正とするfactを明記</text><text x="1184" y="133" font-size="18" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">同じ工数を二重に合計しない</text><rect x="24" y="157" width="554" height="88" rx="8" fill="#fffaf0" stroke="#dccc9f"/><text x="40" y="184" font-size="22" fill="#304b3e" font-weight="800" text-anchor="start" data-edit="true">dimensionを共有</text><text x="40" y="210" font-size="20" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">同じ実体はキー・属性を統一</text><text x="40" y="234" font-size="18" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">factごとに別々の定義にしない</text><rect x="596" y="157" width="554" height="88" rx="8" fill="#fffaf0" stroke="#dccc9f"/><text x="612" y="184" font-size="22" fill="#304b3e" font-weight="800" text-anchor="start" data-edit="true">数値の意味を揃える</text><text x="612" y="210" font-size="20" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">単位・加算性・確定状態を確認</text><text x="612" y="234" font-size="18" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">NULLと0を安易に同一扱いしない</text><rect x="1168" y="157" width="554" height="88" rx="8" fill="#fffaf0" stroke="#dccc9f"/><text x="1184" y="184" font-size="22" fill="#304b3e" font-weight="800" text-anchor="start" data-edit="true">不明点は確認する</text><text x="1184" y="210" font-size="20" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">確認済み・仮置き・確認事項を分ける</text><text x="1184" y="234" font-size="18" fill="#304b3e" font-weight="500" text-anchor="start" data-edit="true">推測で設計を確定しない</text></g><g class="label" id="caution" data-x="100" data-y="1327" transform="translate(100 1327)"><rect width="1750" height="43" rx="10" fill="#fff7df" stroke="#c1ad78"/><text x="22" y="29" font-size="21" fill="#304b3e" font-weight="600" text-anchor="start" data-edit="true">検討中：OKS02／OKS07／OKS10の粒度・修正の反映関係・工数単位・NULLの意味・確定状態・更新／削除の検知方法</text></g><text x="960" y="1430" font-size="28" fill="#304b3e" font-weight="800" text-anchor="middle" data-edit="true">業務の出来事から「1行の意味」を決め、文脈と数値を揃えて、実装・ロード・品質を設計する。</text><text x="960" y="1463" font-size="17" fill="#304b3e" font-weight="500" text-anchor="middle" data-edit="true">参考：モデリング講座  ｜  道は設計の順番。看板は引き継ぐ設計情報。下段の説明枠・決まり事は工程ではありません。</text></svg></main><input id="editor" aria-label="図の文字を修正"><div id="status" role="status"></div><textarea id="dataBox" aria-label="保存用HTML"></textarea><script>let mode='',activeText=null,drag=null;
const svg=document.getElementById('map'),editor=document.getElementById('editor'),status=document.getElementById('status');
function state(m){mode=m;svg.classList.toggle('editing',m==='text');svg.classList.toggle('moving',m==='move');document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));status.textContent=m==='text'?'図の文字をクリックして直接修正。Enterで確定、Escで取消。':m==='move'?'建物・説明枠・注意書きをドラッグ。建物を動かすと道・矢印・途中の看板が追従します。':'文字・配置を修正し、編集済みHTMLを保存できます。Notionの元ページ・添付は自動更新されません。';}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{finish();state(mode===b.dataset.mode?'':b.dataset.mode)});
function finish(commit=true){if(activeText&&commit)activeText.textContent=editor.value;activeText=null;editor.style.display='none';}
svg.addEventListener('click',e=>{if(mode!=='text'||!e.target.matches('text[data-edit]'))return;finish();activeText=e.target;let r=e.target.getBoundingClientRect();editor.style.left=Math.max(8,Math.min(r.left,window.innerWidth-240))+'px';editor.style.top=Math.max(8,Math.min(r.top,window.innerHeight-60))+'px';editor.style.width=Math.min(window.innerWidth-16,Math.max(r.width+40,240))+'px';editor.value=e.target.textContent;editor.style.display='block';editor.focus();editor.select();});
editor.addEventListener('keydown',e=>{if(e.key==='Enter')finish();if(e.key==='Escape')finish(false)});editor.addEventListener('blur',()=>finish());
function point(e){let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function updateRoads(){document.querySelectorAll('.edge').forEach(e=>{let a=document.getElementById(e.dataset.from),b=document.getElementById(e.dataset.to);let ax=+a.dataset.x,ay=+a.dataset.y,aw=+a.dataset.w,ah=+a.dataset.h,bx=+b.dataset.x,by=+b.dataset.y,bw=+b.dataset.w,bh=+b.dataset.h;let x1,y1,x2,y2,mx,my,d;
if(e.dataset.kind==='h'){x1=ax+aw;y1=ay+191;x2=bx;y2=by+191;mx=(x1+x2)/2;my=(y1+y2)/2;d=`M ${x1} ${y1} C ${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`;}else{x1=ax+aw/2;y1=ay+ah;x2=bx+bw/2;y2=by;mx=(x1+x2)/2;my=(y1+y2)/2;d=`M ${x1} ${y1} C ${x1} ${my} ${x2} ${my} ${x2} ${y2}`;}
e.querySelectorAll('path').forEach(p=>p.setAttribute('d',d));let sign=e.querySelector('.sign'),r=sign.querySelector('rect'),t=sign.querySelector('text'),w=+r.getAttribute('width');r.setAttribute('x',mx-w/2);r.setAttribute('y',my-56);t.setAttribute('x',mx);t.setAttribute('y',my-31);});}
svg.addEventListener('pointerdown',e=>{if(mode!=='move')return;let g=e.target.closest('.node,.panel,.label');if(!g)return;let p=point(e);drag={g,p,x:+g.dataset.x,y:+g.dataset.y};svg.setPointerCapture(e.pointerId);e.preventDefault();});
svg.addEventListener('pointermove',e=>{if(!drag)return;let p=point(e),x=drag.x+p.x-drag.p.x,y=drag.y+p.y-drag.p.y;drag.g.dataset.x=x;drag.g.dataset.y=y;drag.g.setAttribute('transform',`translate(${x} ${y})`);updateRoads();});svg.addEventListener('pointerup',()=>drag=null);
function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);status.textContent='保存を要求しました。ブラウザのダウンロード履歴で確認してください。';}
function svgData(){let s=svg.cloneNode(true);s.classList.remove('moving','editing');return new XMLSerializer().serializeToString(s);}
function htmlData(){finish();let d=document.documentElement.cloneNode(true);d.querySelector('#editor').style.display='none';d.querySelector('#dataBox').style.display='none';d.querySelector('#dataBox').textContent='';d.querySelector('#map').classList.remove('editing','moving');d.querySelectorAll('[data-mode]').forEach(b=>b.classList.remove('active'));return '<!DOCTYPE html>\n'+d.outerHTML;}
document.getElementById('save').onclick=()=>download('modeling_island_edited.html',htmlData(),'text/html;charset=utf-8');
document.getElementById('exportSVG').onclick=()=>{finish();download('modeling_island_edited.svg',svgData(),'image/svg+xml;charset=utf-8')};
document.getElementById('copy').onclick=async()=>{let s=htmlData();try{await navigator.clipboard.writeText(s);status.textContent='編集済みHTMLをコピーしました。UTF-8の.htmlファイルとして保存してください。'}catch{let t=document.getElementById('dataBox');t.style.display='block';t.value=s;t.focus();t.select();status.textContent='HTMLを表示しました。Ctrl+C／Cmd+Cでコピーして保存してください。'}};
document.getElementById('exportPNG').onclick=()=>{finish();let u=URL.createObjectURL(new Blob([svgData()],{type:'image/svg+xml'})),im=new Image();im.onload=()=>{let c=document.createElement('canvas');c.width=1920;c.height=1480;c.getContext('2d').drawImage(im,0,0,1920,1480);c.toBlob(b=>{let a=document.createElement('a'),v=URL.createObjectURL(b);a.href=v;a.download='modeling_island_edited.png';a.click();setTimeout(()=>URL.revokeObjectURL(v),2000)},'image/png');URL.revokeObjectURL(u);};im.src=u;};
state('');
</script></body></html>
